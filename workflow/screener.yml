name: Daily OTU Screener

on:
  schedule:
    # 9:00 AM CDT (UTC-5) is 14:00 UTC, Monday through Friday
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Screener
        run: |
          python otu_advanced_screener.py

      - name: Save Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: screener-results
          path: otu_advanced_*.xlsx
          retention-days: 7
